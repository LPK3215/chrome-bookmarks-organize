name: pages

# 项目全景观览站发布到 GitHub Pages。
#
# 当前状态：已禁用（gh workflow disable）。
# 原因：账号因账单问题被锁定，Actions 无法运行。
# 当前 Pages 走经典部署（build_type=legacy, source=main/docs），不依赖 Actions。
#
# 切回 Actions 模式（Actions 恢复后）：
#   1. gh workflow enable pages.yml
#   2. gh api -X PUT /repos/<owner>/<repo>/pages -f build_type=workflow
#   3. 仓库 Settings → Pages → Source 选「GitHub Actions」
#
# 切回经典模式：
#   gh api -X PUT /repos/<owner>/<repo>/pages -f build_type=legacy -f "source[branch]=main" -f "source[path]=/docs"
#
# 注意：两种模式下 docs/ 和 project_overview/ 需保持同步。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: 上传 project_overview 为站点根
        uses: actions/upload-pages-artifact@v3
        with:
          path: project_overview

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
