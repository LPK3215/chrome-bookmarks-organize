name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 三个平台都跑一遍：macOS/Linux 的 detect 分支在本机没法实测，
    # CI 至少保证它们的行为不会因为改动而回归。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 编译自检
        run: python -m py_compile scripts/bm.py scripts/test/run_tests.py scripts/test/sample/make_sample.py

      - name: 回归测试
        run: python scripts/test/run_tests.py

      - name: 端到端冒烟（合成样例）
        run: |
          python scripts/bm.py detect
          python scripts/bm.py show --file scripts/test/sample/Bookmarks.before --stats
          python scripts/bm.py plan --file scripts/test/sample/Bookmarks.before --out cand --sort --dedup
          python scripts/bm.py diff --a scripts/test/sample/Bookmarks.before --b scripts/test/sample/Bookmarks.after
          python scripts/bm.py verify --file scripts/test/sample/Bookmarks.after
