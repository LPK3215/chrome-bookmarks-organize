<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title>三份交付物 · 从轻到全</title>
  <style>
    text { font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace; }
    @media (prefers-color-scheme: dark) {
    .f-bg { fill: #0a0f1a; }
    .f-panel { fill: #0f1728; }
    .f-panel2 { fill: #141f33; }
    .f-blue-bg { fill: #16294a; }
    .f-green-bg { fill: #123021; }
    .f-yellow-bg { fill: #33280f; }
    .f-red-bg { fill: #36161a; }
    .f-purple-bg { fill: #241a44; }
    .f-gray-bg { fill: #172032; }
    .f-dim { fill: #7c8ea8; }
    .f-dim2 { fill: #63748d; }
    .t-tx { fill: #e9eefb; }
    .t-dim { fill: #93a5c2; }
    .t-dim2 { fill: #6e809d; }
    .t-blue { fill: #8ab4ff; }
    .t-green { fill: #6ee79b; }
    .t-yellow { fill: #fbd25c; }
    .t-red { fill: #ff8a80; }
    .t-purple { fill: #b9a5ff; }
    .s-bd { stroke: #2a3a58; }
    .s-blue { stroke: #5b9bff; }
    .s-green { stroke: #4ade80; }
    .s-yellow { stroke: #fbc531; }
    .s-red { stroke: #ff6b5e; }
    .s-purple { stroke: #a78bfa; }
    .s-dim { stroke: #7c8ea8; }
    .s-dim2 { stroke: #5b6c85; }
    }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#94a3b8"/></marker>
    <marker id="arw-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#4285f4"/></marker>
    <marker id="arw-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#34a853"/></marker>
    <marker id="arw-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#ea4335"/></marker>
    <marker id="arw-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#f5a623"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="620" rx="0" class="f-bg" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-size="20" font-weight="800" class="t-tx" fill="#0d1626">同一套逻辑，三份交付物 —— 从轻到全</text>
  <text x="600" y="74" text-anchor="middle" font-size="13.5" font-weight="500" class="t-dim" fill="#55677f">跑的是同一条「带循环」的 0→7 流程，差别只在闸门由谁守</text>
  <rect x="60.0" y="108" width="340" height="330" rx="16" class="f-blue-bg s-blue" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.3"/>
  <rect x="60.0" y="108" width="340" height="6" rx="3" fill="#4285f4"/>
  <text x="84.0" y="154" text-anchor="start" font-size="21" font-weight="800" class="t-blue-fg" fill="#1a56c4" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">PROMPT.md</text>
  <rect x="84.0" y="168" width="4" height="16" rx="2" fill="#4285f4"/>
  <text x="96.0" y="181" text-anchor="start" font-size="13.5" font-weight="600" class="t-tx" fill="#0d1626">一段话 · 零安装</text>
  <rect x="84.0" y="200" width="88" height="24" rx="12" fill="#4285f4" opacity="0.14"/>
  <text x="94.0" y="216" text-anchor="start" font-size="11.5" font-weight="800" class="t-blue" fill="#4285f4">〔轻路径 · 无闸门〕</text>
  <circle cx="90.0" cy="254" r="3" fill="#4285f4"/>
  <text x="102.0" y="258" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">整段复制给任意聊天 AI 即可跑</text>
  <circle cx="90.0" cy="282" r="3" fill="#4285f4"/>
  <text x="102.0" y="286" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">备份 / 退浏览器 / 删 checksum 全靠自觉</text>
  <circle cx="90.0" cy="310" r="3" fill="#4285f4"/>
  <text x="102.0" y="314" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">给一次性整理 · 先体验 · 分享给别人</text>
  <rect x="430.0" y="108" width="340" height="330" rx="16" class="f-purple-bg s-purple" fill="#f3edff" stroke="#8b5cf6" stroke-width="1.3"/>
  <rect x="430.0" y="108" width="340" height="6" rx="3" fill="#8b5cf6"/>
  <text x="454.0" y="154" text-anchor="start" font-size="21" font-weight="800" class="t-purple-fg" fill="#6d28d9" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">SKILL.md</text>
  <rect x="454.0" y="168" width="4" height="16" rx="2" fill="#8b5cf6"/>
  <text x="466.0" y="181" text-anchor="start" font-size="13.5" font-weight="600" class="t-tx" fill="#0d1626">流程与纪律 · Skill 化</text>
  <rect x="454.0" y="200" width="96" height="24" rx="12" fill="#8b5cf6" opacity="0.14"/>
  <text x="464.0" y="216" text-anchor="start" font-size="11.5" font-weight="800" class="t-purple" fill="#8b5cf6">〔中间层 · 人肉守闸〕</text>
  <circle cx="460.0" cy="254" r="3" fill="#8b5cf6"/>
  <text x="472.0" y="258" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">同一条 0→7 流程 + 硬约束 + Pitfalls</text>
  <circle cx="460.0" cy="282" r="3" fill="#8b5cf6"/>
  <text x="472.0" y="286" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">拿不到脚本时自动降级执行</text>
  <circle cx="460.0" cy="310" r="3" fill="#8b5cf6"/>
  <text x="472.0" y="314" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">可单独加载当提示词 / 装成 skill</text>
  <rect x="800.0" y="108" width="340" height="330" rx="16" class="f-green-bg s-green" fill="#e6f5ea" stroke="#34a853" stroke-width="1.6"/>
  <rect x="800.0" y="108" width="340" height="6" rx="3" fill="#34a853"/>
  <text x="824.0" y="154" text-anchor="start" font-size="21" font-weight="800" class="t-green-fg" fill="#1e7e34" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">scripts/bm.py</text>
  <rect x="824.0" y="168" width="4" height="16" rx="2" fill="#34a853"/>
  <text x="836.0" y="181" text-anchor="start" font-size="13.5" font-weight="600" class="t-tx" fill="#0d1626">默认执行层 · 闸门锁进代码</text>
  <rect x="824.0" y="200" width="96" height="24" rx="12" fill="#34a853" opacity="0.14"/>
  <text x="834.0" y="216" text-anchor="start" font-size="11.5" font-weight="800" class="t-green" fill="#34a853">〔正式用法（唯一推荐）〕</text>
  <circle cx="830.0" cy="254" r="3" fill="#34a853"/>
  <text x="842.0" y="258" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">10 个子命令：detect → restore</text>
  <circle cx="830.0" cy="282" r="3" fill="#34a853"/>
  <text x="842.0" y="286" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">体检 / 底牌 / 预览 / 原子写回 / 还原</text>
  <circle cx="830.0" cy="310" r="3" fill="#34a853"/>
  <text x="842.0" y="314" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">1010 行单文件、仅标准库、零依赖</text>
  <circle cx="830.0" cy="338" r="3" fill="#34a853"/>
  <text x="842.0" y="342" text-anchor="start" font-size="13" font-weight="500" class="t-tx" fill="#0d1626">一次写对、每次一样 —— 对真实书签动手</text>
  <rect x="1076" y="97" width="46" height="24" rx="12" fill="#34a853"/>
  <text x="1099" y="113.5" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">默认</text>
  <line x1="400.0" y1="273" x2="426.0" y2="273" class="s-dim" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arw)"/>
  <line x1="770.0" y1="273" x2="796.0" y2="273" class="s-dim" stroke="#94a3b8" stroke-width="2.4" marker-end="url(#arw)"/>
  <rect x="60.0" y="472" width="1080" height="108" rx="14" class="f-panel2 s-gray" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="84.0" y="506" text-anchor="start" font-size="15" font-weight="800" class="t-tx" fill="#0d1626">判定（动手前先看工作区）</text>
  <text x="84.0" y="534" text-anchor="start" font-size="13.5" font-weight="500" class="t-tx" fill="#0d1626">① 有</text>
  <text x="118.0" y="534" text-anchor="start" font-size="13.5" font-weight="800" class="t-green" fill="#34a853" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">scripts/bm.py</text>
  <text x="236.0" y="534" text-anchor="start" font-size="13.5" font-weight="600" class="t-tx" fill="#0d1626">→ 一律走脚本（默认）· 禁止绕开它手改 JSON</text>
  <text x="84.0" y="562" text-anchor="start" font-size="13.5" font-weight="500" class="t-tx" fill="#0d1626">② 拿不到脚本 → 降级「仅提示词」（SKILL.md 流程，AI 人肉守闸）</text>
  <text x="620.0" y="562" text-anchor="start" font-size="13.5" font-weight="500" class="t-tx" fill="#0d1626">③ 只是临时体验 → 复制 PROMPT.md</text>
</svg>
