<text x="96" y="189" font-size="13.5" font-weight="600" fill="#0284c7">一段话 · 零安装</text>
<text x="84" y="216" font-size="11.5" fill="#0284c7" opacity="0.9">〔轻路径〕</text>
<text x="84" y="250" font-size="13" fill="#0c4a6e">· 复制给任意聊天 AI 就能跑</text>
<text x="84" y="277" font-size="13" fill="#0c4a6e">· 无闸门：备份/写回全靠临场做对</text>
