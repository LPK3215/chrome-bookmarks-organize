<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" font-family="'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <title>0→7 带循环主流程</title>
  <style>
    text { font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace; }
    @media (prefers-color-scheme: dark) {
    .f-bg { fill: #0a0f1a; }
    .f-panel { fill: #0f1728; }
    .f-panel2 { fill: #141f33; }
    .f-blue-bg { fill: #16294a; }
    .f-green-bg { fill: #123021; }
    .f-yellow-bg { fill: #33280f; }
    .f-red-bg { fill: #36161a; }
    .f-purple-bg { fill: #241a44; }
    .f-gray-bg { fill: #172032; }
    .f-dim { fill: #7c8ea8; }
    .f-dim2 { fill: #63748d; }
    .t-tx { fill: #e9eefb; }
    .t-dim { fill: #93a5c2; }
    .t-dim2 { fill: #6e809d; }
    .t-blue { fill: #8ab4ff; }
    .t-green { fill: #6ee79b; }
    .t-yellow { fill: #fbd25c; }
    .t-red { fill: #ff8a80; }
    .t-purple { fill: #b9a5ff; }
    .s-bd { stroke: #2a3a58; }
    .s-blue { stroke: #5b9bff; }
    .s-green { stroke: #4ade80; }
    .s-yellow { stroke: #fbc531; }
    .s-red { stroke: #ff6b5e; }
    .s-purple { stroke: #a78bfa; }
    .s-dim { stroke: #7c8ea8; }
    .s-dim2 { stroke: #5b6c85; }
    }
  </style>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#94a3b8"/></marker>
    <marker id="arw-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#4285f4"/></marker>
    <marker id="arw-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#34a853"/></marker>
    <marker id="arw-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#ea4335"/></marker>
    <marker id="arw-yellow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="f-dim" fill="#f5a623"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="700" rx="0" class="f-bg" fill="#ffffff"/>
  <text x="60" y="46" text-anchor="start" font-size="19" font-weight="800" class="t-tx" fill="#0d1626">0→7 主流程：带循环，只有一个写入口</text>
  <text x="60" y="70" text-anchor="start" font-size="12.5" font-weight="500" class="t-dim" fill="#55677f">准备段只读 → 循环区反复确认（不碰真身）→ 拍板后唯一写回 → 校验验收 → 不满意回底牌</text>
  <circle cx="69" cy="104" r="9" fill="#4285f4"/>
  <text x="69" y="108" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">①</text>
  <text x="86" y="108" font-size="12.5" font-weight="700" class="t-dim" fill="#55677f">定位 · 体检 · 底牌 · 读结构（全程只读）</text>
  <rect x="111.0" y="118.0" width="210" height="64" rx="12" class="f-blue-bg s-blue" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="216.0" y="147" text-anchor="middle" font-size="15" font-weight="800" class="t-blue" fill="#1a56c4" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">detect</text>
  <text x="216.0" y="166" text-anchor="middle" font-size="11.5" class="t-dim" fill="#55677f">按 OS 环境变量定位 Bookmarks</text>
  <line x1="321.0" y1="150" x2="363.0" y2="150" class="s-dim" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="367.0" y="118.0" width="210" height="64" rx="12" class="f-blue-bg s-blue" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="472.0" y="147" text-anchor="middle" font-size="15" font-weight="800" class="t-blue" fill="#1a56c4" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">preflight</text>
  <text x="472.0" y="166" text-anchor="middle" font-size="11.5" class="t-dim" fill="#55677f">体检 → GO / NO-GO</text>
  <line x1="577.0" y1="150" x2="619.0" y2="150" class="s-dim" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="623.0" y="118.0" width="210" height="64" rx="12" class="f-blue-bg s-blue" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="728.0" y="147" text-anchor="middle" font-size="15" font-weight="800" class="t-blue" fill="#1a56c4" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">backup</text>
  <text x="728.0" y="166" text-anchor="middle" font-size="11.5" class="t-dim" fill="#55677f">时间戳底牌 + sha256 + 还原命令</text>
  <line x1="833.0" y1="150" x2="875.0" y2="150" class="s-dim" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="879.0" y="118.0" width="210" height="64" rx="12" class="f-blue-bg s-blue" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="984.0" y="147" text-anchor="middle" font-size="15" font-weight="800" class="t-blue" fill="#1a56c4" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">show</text>
  <text x="984.0" y="166" text-anchor="middle" font-size="11.5" class="t-dim" fill="#55677f">读结构 · 逐条标重复（同/跨目录）</text>
  <line x1="984.0" y1="182" x2="984.0" y2="206" class="s-dim" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="111" y="210" width="978" height="150" rx="16" class="f-yellow-bg s-yellow" fill="#fef6e4" stroke="#f5a623" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="137" y="242" text-anchor="start" font-size="14" font-weight="800" class="t-yellow" fill="#f5a623">② 循环区 · 改到满意才放行（全程不写原文件）</text>
  <rect x="300.0" y="268.0" width="240" height="64" rx="12" class="f-yellow-bg s-yellow" fill="#fef6e4" stroke="#f5a623" stroke-width="1.5"/>
  <text x="420" y="297" text-anchor="middle" font-size="15" font-weight="800" class="t-yellow" fill="#a35c00" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">plan</text>
  <text x="420" y="316" text-anchor="middle" font-size="11.5" class="t-dim" fill="#55677f">--sort / --dedup → 候选文件</text>
  <rect x="660.0" y="268.0" width="260" height="64" rx="12" class="f-yellow-bg s-yellow" fill="#fef6e4" stroke="#f5a623" stroke-width="1.5"/>
  <text x="790" y="297" text-anchor="middle" font-size="15" font-weight="800" class="t-yellow" fill="#a35c00" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">preview</text>
  <text x="790" y="316" text-anchor="middle" font-size="11.5" class="t-dim" fill="#55677f">渲染本地 HTML 肉眼核对</text>
  <text x="600" y="296" text-anchor="middle" font-size="22" font-weight="800" class="t-yellow" fill="#f5a623">⇄</text>
  <text x="600" y="320" text-anchor="middle" font-size="11" font-weight="600" class="t-dim" fill="#55677f">与用户反复确认</text>
  <line x1="600" y1="360" x2="600" y2="398" class="s-red" stroke="#ea4335" stroke-width="2.2" marker-end="url(#arw)"/>
  <text x="614" y="388" text-anchor="start" font-size="12" font-weight="700" class="t-red" fill="#ea4335">用户拍板「就这版」↓</text>
  <circle cx="205" cy="388" r="9" fill="#ea4335"/>
  <text x="205" y="392" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">③</text>
  <text x="222" y="392" font-size="12.5" font-weight="700" class="t-dim" fill="#55677f">写回 · 校验 · 验收</text>
  <rect x="181.0" y="405.0" width="250" height="70" rx="12" class="f-red-bg s-red" fill="#fdeceb" stroke="#ea4335" stroke-width="1.5"/>
  <text x="306.0" y="437" text-anchor="middle" font-size="15" font-weight="800" class="t-red" fill="#c5221f" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">finalize</text>
  <text x="306.0" y="456" text-anchor="middle" font-size="11.5" class="t-dim" fill="#55677f">唯一写回 · 原子替换 · 自动兜底</text>
  <rect x="350.0" y="396.0" width="71" height="19" rx="9.5" fill="#ea4335" stroke="none"/>
  <text x="385.5" y="409.5" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">唯一写入口</text>
  <line x1="431.0" y1="440" x2="471.0" y2="440" class="s-green" stroke="#34a853" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="475.0" y="405.0" width="250" height="70" rx="12" class="f-green-bg s-green" fill="#e6f5ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="600.0" y="437" text-anchor="middle" font-size="15" font-weight="800" class="t-green" fill="#1e7e34" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">verify / diff</text>
  <text x="600.0" y="456" text-anchor="middle" font-size="11.5" class="t-dim" fill="#55677f">结构 · 数量 · 变更分类对账</text>
  <line x1="725.0" y1="440" x2="765.0" y2="440" class="s-green" stroke="#34a853" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="769.0" y="405.0" width="250" height="70" rx="12" class="f-green-bg s-green" fill="#e6f5ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="894.0" y="437" text-anchor="middle" font-size="15" font-weight="800" class="t-green" fill="#1e7e34" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, 'Microsoft YaHei Mono', monospace">重启浏览器验收</text>
  <text x="894.0" y="456" text-anchor="middle" font-size="11.5" class="t-dim" fill="#55677f">肉眼确认新结构生效</text>
  <line x1="894.0" y1="475" x2="894.0" y2="526" class="s-red" stroke="#ea4335" stroke-width="2" marker-end="url(#arw)"/>
  <rect x="600" y="530" width="560" height="110" rx="14" class="f-red-bg s-red" fill="#fdeceb" stroke="#ea4335" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="880.0" y="564" text-anchor="middle" font-size="15" font-weight="800" class="t-red" fill="#ea4335">不满意 → restore 一键还原</text>
  <text x="880.0" y="590" text-anchor="middle" font-size="12.5" font-weight="600" class="t-dim" fill="#55677f">回退到底牌那一刻，回到 ② 循环区换规则重来</text>
  <text x="880.0" y="616" text-anchor="middle" font-size="11" font-weight="600" class="t-dim2" fill="#8494ab">与 finalize 同级安全闸：浏览器在跑拒绝 · 覆盖前先校验底牌</text>
  <path d="M1170,585 L1170,320 L1092,320" fill="none" class="s-red" stroke="#ea4335" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#arw-red)"/>
  <text x="60" y="678" text-anchor="start" font-size="11.5" font-weight="500" class="t-dim2" fill="#8494ab">虚线框 = 循环 / 回退路径　·　红 = 会真正改动文件的操作　·　绿 = 校验与验收　·　蓝 = 只读准备</text>
</svg>
