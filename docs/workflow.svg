<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arw-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
<text x="150" y="58" font-size="12.5" font-weight="600" fill="#64748b">① 定位 · 底牌 · 读结构（全程只读）</text>
<g>
  <rect x="150.0" y="78" width="150" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="225" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#312e81">detect</text>
  <text x="225" y="125" text-anchor="middle" font-size="11" fill="#475569">按 OS 定位 Bookmarks</text>
</g>
<line x1="305" y1="108" x2="326" y2="108" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
<g>
  <rect x="325.0" y="78" width="180" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="415" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#312e81">preflight</text>
  <text x="415" y="125" text-anchor="middle" font-size="11" fill="#475569">体检 → GO / NO-GO</text>
</g>
<line x1="510" y1="108" x2="531" y2="108" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
<g>
  <rect x="535.0" y="78" width="150" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="610" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#312e81">backup</text>
  <text x="610" y="125" text-anchor="middle" font-size="11" fill="#475569">底牌 + sha256 + 还原命令</text>
</g>
<line x1="690" y1="108" x2="711" y2="108" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
<g>
  <rect x="720.0" y="78" width="150" height="60" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="795" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#312e81">show</text>
  <text x="795" y="125" text-anchor="middle" font-size="11" fill="#475569">读结构 · 逐条标重复</text>
</g>
<line x1="795" y1="140" x2="795" y2="181" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
<rect x="40" y="190" width="1040" height="150" rx="16" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="560" y="219" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">② 循环区 · 改到满意才放行（全程不写原文件）</text>
<g>
  <rect x="167.5" y="245" width="175" height="60" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="255" y="273" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">plan</text>
  <text x="255" y="292" text-anchor="middle" font-size="11" fill="#475569">重排 → 候选文件</text>
</g>
<g>
  <rect x="527.5" y="245" width="195" height="60" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="625" y="273" text-anchor="middle" font-size="14.5" font-weight="700" fill="#b45309">preview</text>
  <text x="625" y="292" text-anchor="middle" font-size="11" fill="#475569">渲染本地 HTML 肉眼核对</text>
</g>
<text x="470" y="264" text-anchor="middle" font-size="24" font-weight="700" fill="#f59e0b">⇄</text>
<text x="470" y="300" text-anchor="middle" font-size="11" fill="#475569">与用户反复确认</text>
<line x1="405" y1="340" x2="405" y2="372" stroke="#10b981" stroke-width="2" marker-end="url(#arw)"/>
<text x="500" y="364" font-size="11.5" fill="#10b981">用户拍板「就这版」↓</text>
<text x="150" y="425" font-size="12.5" font-weight="600" fill="#64748b">③ 写回 · 校验 · 验收</text>
<g>
  <rect x="302.5" y="380" width="205" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="405" y="408" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7f1d1d">finalize</text>
  <text x="405" y="427" text-anchor="middle" font-size="11" fill="#475569">唯一写回 · 原子替换 · 自动兜底</text>
</g>
<line x1="510" y1="410" x2="568" y2="410" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
<g>
  <rect x="570.5" y="380" width="195" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="668" y="408" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">verify / diff</text>
  <text x="668" y="427" text-anchor="middle" font-size="11" fill="#475569">结构 · 数量 · 变更分类对账</text>
</g>
<line x1="770" y1="410" x2="818" y2="410" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>
<g>
  <rect x="820.0" y="380" width="200" height="60" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="920" y="408" text-anchor="middle" font-size="14.5" font-weight="700" fill="#065f46">重启浏览器验收</text>
  <text x="920" y="427" text-anchor="middle" font-size="11" fill="#475569">肉眼确认新结构生效</text>
</g>
<line x1="920" y1="442" x2="920" y2="497" stroke="#e11d48" stroke-width="2" marker-end="url(#arw)"/>
<rect x="560" y="505" width="600" height="90" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="8 5"/>
<text x="860" y="536" text-anchor="middle" font-size="14" font-weight="700" fill="#be123c">不满意 → restore 一键还原</text>
<text x="860" y="562" text-anchor="middle" font-size="12.5" fill="#9f1239">回退到底牌那一刻；回到 ② 循环区，换规则重新 plan / preview</text>
<polyline points="1120,505 1120,430 990,346" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arw-red)"/>
</svg>
